steam_overlay_conflict_dialog:
  title: "Aviso"
  content: >-
    Las compras podrían dejar de funcionar si el overlay de Hachimi está activo. Si ya ves el overlay para
    realizar compras en Steam, ignora este mensaje y pulsa No. Si no ves nada, pulsa Sí para desactivar
    temporalmente el overlay de Hachimi. Esto cerrará el juego y, al iniciarlo nuevamente, el overlay de
    Hachimi estará desactivado para que puedas realizar compras. Después de realizarlas, podrás
    volver a usar el overlay de Hachimi tras reiniciar el juego.


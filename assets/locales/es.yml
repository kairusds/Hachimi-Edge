  cheatsheet_title: "Guía de la cámara libre"
  cheatsheet_contents: |
    # Guía rápida de la Cámara Libre
    Esta función solo está disponible en **Carreras** o **Conciertos**.
    
    La parte del cuerpo por defecto es **Face**.
    
    El objetivo por defecto es **Place01**.
    
    ## Controles de ratón
    * **Mantener clic derecho + arrastrar:** Mirar alrededor
    * **Rueda del ratón arriba / abajo:** Aumentar campo de visión / Reducir campo de visión
    
    ---
    
    ## Controles de mando (Xbox / PlayStation)
    
    ### **Movimiento y ángulo de cámara**
    * **Joystick izquierdo:** Mover a la izquierda / derecha / avanzar / retroceder
    * **Joystick derecho:** Mirar a la izquierda / derecha / arriba / abajo
    * **Gatillo derecho (RT / R2):** Mover hacia arriba
    * **Gatillo izquierdo (LT / L2):** Mover hacia abajo
    * **Botón de hombro derecho (RB / R1):** Reducir campo de visión
    * **Botón de hombro izquierdo (LB / L1):** Aumentar campo de visión
    
    ---
    
    ### Botones de acción
    * **Y** (Triángulo): Restablecer posición de la cámara
    * **X** (Cuadrado): Cambiar modo de cámara
    * **B** (Círculo): Invertir perspectiva orbital *(frontal <-> trasera, solo en cámara orbital)*
    * **A** (Cruz): Pausar / reanudar concierto
    
    ---
    
    ### Controles de la cruceta (No disponible en movimiento libre)
    * **Cruceta derecha:** Siguiente objetivo *(Cámara orbital y primera persona)*
    * **Cruceta izquierda:** Objetivo anterior *(Cámara orbital y primera persona)*
    * **Cruceta arriba:** Siguiente parte *(Solo en cámara orbital)*
    * **Cruceta abajo:** Parte anterior *(Solo en cámara orbital)*


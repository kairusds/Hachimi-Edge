  key_reverse: "反向"
  settings_title: "自由视角设置"
  cheatsheet_title: "自由视角快捷指南"
  cheatsheet_contents: |
    # 自由视角快捷指南
    本功能仅在 **比赛** 或 **Live 舞台** 中生效。

    默认跟随部位为 **头部**。

    在比赛中默认跟随 **1号闸位**。

    ## 鼠标操作
    * **按住右键并拖动：** 旋转视角
    * **滚轮向上 / 向下：** 调整FOV

    ---

    ## 手柄操作 (Xbox / PlayStation)

    ### **移动与视角**
    * **左摇杆：** 移动
    * **右摇杆：** 旋转视角
    * **右扳机键 (RT / R2)：** 上升
    * **左扳机键 (LT / L2)：** 下降
    * **右侧肩键 (RB / R1)：** 减小FOV
    * **左侧肩键 (LB / L1)：** 增大FOV

    ---

    ### 功能按键
    * **Y键** (三角)：重置相机位置
    * **X键** (方块)：切换相机模式
    * **B键** (圆圈)：翻转跟随视角方向 *(前 <-> 后，仅跟随角色模式)*
    * **A键** (叉号)：暂停 Live

    ---

    ### 十字键控制 (自由移动模式下不可用)
    * **十字键-左：** 上一个目标 *(仅跟随角色与第一人称)*
    * **十字键-右：** 下一个目标 *(仅跟随角色与第一人称)*
    * **十字键-上：** 下一个部位 *(仅跟随角色)*
    * **十字键-下：** 上一个部位 *(仅跟随角色)*


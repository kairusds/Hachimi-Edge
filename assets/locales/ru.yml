  key_follow_offset_left: "Сместить камеру следования влево"
  key_follow_offset_right: "Сместить камеру следования вправо"
  key_target_previous: "Предыдущая цель"
  key_target_next: "Следующая цель"
  key_part_previous: "Предыдущая часть тела"
  key_part_next: "Следующая часть тела"
  key_reset: "Сбросить положение камеры"
  key_cycle_mode: "Переключить режим"
  key_reverse: "Перевернуть ракурс камеры следования (вперёд <-> назад)"
  cheatsheet_title: "Памятка по свободной камере"
  cheatsheet_contents: |
    # Памятка по свободной камере
    Эта функция работает только в **забегах** или **концертах**.

    Следуемая часть тела по умолчанию - **Face** (лицо).

    Следуемая позиция по умолчанию - **Place01** (1-е место).

    ## Управление мышью
    * **Зажать ПКМ и передвигать:** Осмотреться
    * **Колёсико вверх/вниз:** Увеличить/уменьшить FOV

    ---

    ## Управление геймпадом (Xbox / PlayStation)

    ### **Движение и ракурс камеры**
    * **Левый стик:** Двигаться влево / вправо / вперёд / назад
    * **Правый стик:** Повернуть влево / вправо / вверх / вниз
    * **Правый триггер (RT / R2):** Двигаться вверх
    * **Левый триггер (LT / L2):** Двигаться вниз
    * **Правый бампер (RB / R1):** Уменьшить FOV
    * **Левый бампер (LB / L1):** Увеличить FOV

    ---

    ### Кнопки действий
    * **Y** (Треугольник): Сбросить положение камеры
    * **X** (Квадрат): Переключить режим камеры
    * **B** (Круг): Перевернуть ракурс камеры *(спереди <-> сзади, только при следовании)*
    * **A** (Крест): Пауза / продолжение концерта

    ---

    ### Управление крестовиной (недоступно при свободном перемещении)
    * **Вправо:** Следующая цель *(при следовании и от первого лица)*
    * **Влево:** Предыдущая цель *(при следовании и от первого лица)*
    * **Вверх:** Следующая часть тела *(только при следовании)*
    * **Вниз:** Предыдущая часть тела *(только при следовании)*

